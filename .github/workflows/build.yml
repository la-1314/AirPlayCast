name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle Wrapper
        run: |
          # Download gradle-wrapper.jar if missing (binary file not committed to repo)
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar from Gradle 8.9 release..."
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          # Download gradlew if the committed one is the simplified placeholder
          if ! grep -q "org.gradle.appname" gradlew 2>/dev/null; then
            echo "Downloading full gradlew script from Gradle 8.9 release..."
            curl -fsSL -o gradlew \
              "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew"
            curl -fsSL -o gradlew.bat \
              "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew.bat"
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Show Build Errors
        if: failure()
        run: |
          echo "=== Last 200 lines of build output ==="
          tail -200 /tmp/build.log || true

      - name: Report Build Errors as Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 提取编译错误并创建 Issue，便于离线诊断
          COMMIT_SHA=$(git rev-parse --short HEAD)
          {
            echo "## 构建失败日志 (commit ${COMMIT_SHA})"
            echo ""
            echo '```'
            tail -200 /tmp/build.log 2>/dev/null || echo "no log"
            echo '```'
            echo ""
            echo "---"
            echo "[查看完整运行日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > /tmp/issue-body.md
          # 尝试创建 Issue (失败时输出错误但不阻断)
          gh issue create \
            --title "构建失败: ${COMMIT_SHA}" \
            --body-file /tmp/issue-body.md 2>&1 || true

      - name: Commit Build Log on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 将构建日志提交到仓库，便于离线读取
          COMMIT_SHA=$(git rev-parse --short HEAD)
          mkdir -p build-logs
          tail -300 /tmp/build.log > "build-logs/failure-${COMMIT_SHA}.log" 2>/dev/null || echo "no log" > "build-logs/failure-${COMMIT_SHA}.log"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "build-logs/failure-${COMMIT_SHA}.log"
          git commit -m "chore: 保存构建失败日志 ${COMMIT_SHA} [skip ci]"
          git push

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirPlayCast-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            build/reports
          if-no-files-found: ignore
          retention-days: 7
