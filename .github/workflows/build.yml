name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取完整历史与 tags，用于在 Release 步骤生成 changelog (git describe / git log)
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle Wrapper
        run: |
          # Download gradle-wrapper.jar if missing (binary file not committed to repo)
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar from Gradle 8.9 release..."
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          # Download gradlew if the committed one is the simplified placeholder
          if ! grep -q "org.gradle.appname" gradlew 2>/dev/null; then
            echo "Downloading full gradlew script from Gradle 8.9 release..."
            curl -fsSL -o gradlew \
              "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew"
            curl -fsSL -o gradlew.bat \
              "https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew.bat"
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Show Build Errors
        if: failure()
        run: |
          echo "=== Kotlin compile errors (e:) ==="
          grep -n "^e: " /tmp/build.log || echo "(no e: lines found)"
          echo ""
          echo "=== Kotlin warnings (w:) first 30 ==="
          grep -n "^w: " /tmp/build.log | head -30 || echo "(no w: lines found)"
          echo ""
          echo "=== Last 100 lines of build output ==="
          tail -100 /tmp/build.log || true

      - name: Report Build Errors as Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 提取编译错误并创建 Issue，便于离线诊断
          COMMIT_SHA=$(git rev-parse --short HEAD)
          {
            echo "## 构建失败日志 (commit ${COMMIT_SHA})"
            echo ""
            echo "### Kotlin 编译错误"
            echo '```'
            grep -n "^e: " /tmp/build.log 2>/dev/null || echo "(无 e: 错误行，可能是依赖/插件问题)"
            echo '```'
            echo ""
            echo "### 末尾日志"
            echo '```'
            tail -100 /tmp/build.log 2>/dev/null || echo "no log"
            echo '```'
            echo ""
            echo "---"
            echo "[查看完整运行日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > /tmp/issue-body.md
          # 尝试创建 Issue (失败时输出错误但不阻断)
          gh issue create \
            --title "构建失败: ${COMMIT_SHA}" \
            --body-file /tmp/issue-body.md 2>&1 || true

      - name: Commit Build Log on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 将构建日志 (含 e: 错误行) 提交到仓库，便于离线读取
          COMMIT_SHA=$(git rev-parse --short HEAD)
          mkdir -p build-logs
          {
            echo "=== Kotlin compile errors (e:) ==="
            grep -n "^e: " /tmp/build.log 2>/dev/null || echo "(no e: lines)"
            echo ""
            echo "=== Last 300 lines ==="
            tail -300 /tmp/build.log 2>/dev/null || echo "no log"
          } > "build-logs/failure-${COMMIT_SHA}.log"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "build-logs/failure-${COMMIT_SHA}.log"
          git commit -m "chore: 保存构建失败日志 ${COMMIT_SHA} [skip ci]"
          git push

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirPlayCast-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 从 build.gradle.kts 读取 versionName 作为 Release tag (每次发版必须 bump 版本号)
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            echo "无法从 build.gradle.kts 解析 versionName，跳过发布"
            exit 0
          fi
          TAG="v${VERSION_NAME}"
          echo "目标版本: $TAG"
          # 强制每次发版使用新 tag：已存在则报错，提示 bump versionName
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在。请先在 app/build.gradle.kts 中 bump versionName (和 versionCode) 后重新推送 —— 每次发版必须使用新版本号，不再覆盖旧 Release。"
            exit 1
          fi
          SRC_APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -z "$SRC_APK" ]; then
            echo "未找到 APK，跳过发布"
            exit 0
          fi
          echo "APK: $SRC_APK"
          ASSET_NAME="AirPlayCast-${TAG}-debug.apk"
          cp "$SRC_APK" "$ASSET_NAME"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          # 自动生成 notes：从上一个 tag 到当前的提交日志
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
            NOTES=$(printf 'AirPlay 投屏 App %s (构建: %s)\n\n## 自 %s 以来的变更\n%s' "$TAG" "$COMMIT_SHA" "$PREV_TAG" "$CHANGELOG")
          else
            CHANGELOG=$(git log --pretty=format:"- %s" -10)
            NOTES=$(printf 'AirPlay 投屏 App %s (构建: %s)\n\n## 变更\n%s' "$TAG" "$COMMIT_SHA" "$CHANGELOG")
          fi
          echo "创建 Release $TAG..."
          gh release create "$TAG" "$ASSET_NAME" \
            --title "AirPlayCast ${TAG}" \
            --notes "$NOTES" \
            --target main
          echo "Release 发布完成: https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            build/reports
          if-no-files-found: ignore
          retention-days: 7
